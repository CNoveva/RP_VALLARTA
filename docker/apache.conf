# Apache para la app (se habilita con a2enconf app)
ServerName localhost

# Sin listado de directorios; index.php como página por defecto
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    DirectoryIndex index.php
    Require all granted
</Directory>

# Archivos que no deben servirse aunque llegaran a estar en la imagen
<FilesMatch "\.(sql|md|ini|env|example)$">
    Require all denied
</FilesMatch>
<DirectoryMatch "/var/www/html/(docker|scripts)">
    Require all denied
</DirectoryMatch>

# Detrás del proxy de Coolify (Traefik) la app siempre se sirve por HTTPS
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
